name: CI

# Verifies that every formula change actually builds, passes audit and runs,
# on both platforms the tap supports. The tap had no CI before: bumps were
# merged after a manual local `brew install --build-from-source`, which meant
# the check was as reliable as whoever remembered to run it.
#
# Building from source is what catches a stale `resource` block: the bump
# workflow in rgielen/leitum rewrites only `url` and `sha256`, so if a release
# adds or drops a transitive dependency, pip resolution fails here rather than
# on a user's machine.

on:
  pull_request:
  workflow_dispatch:

# A formula build takes tens of minutes; a push to main after a green PR would
# only repeat what the PR already proved.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: leitum on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even when one fails — knowing it is Linux-only
      # is worth another few minutes.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      # Pinned deliberately: @master is deprecated and becomes a hard error with
      # Homebrew 5.2.0. This tap has no Renovate, so the SHA is bumped by hand.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # `brew audit [path]` is disabled in current Homebrew — every command needs
      # a formula NAME, so this PR's checkout has to be what Homebrew sees as
      # the tap. setup-homebrew already symlinks it there; this only fills in if
      # that ever changes. Do not replace an existing symlink with a copy: the
      # action's post-job cleanup removes the path with a plain `rm`, which
      # fails on a real directory.
      - name: Confirm the checkout is Homebrew's copy of this tap
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/rgielen/homebrew-taps"
          if [ ! -e "$TAP_DIR" ]; then
            echo "setup-homebrew did not link the tap; linking it manually."
            mkdir -p "$(dirname "$TAP_DIR")"
            ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"
          fi
          brew tap
          test -f "$TAP_DIR/Formula/leitum.rb"

      - name: Audit
        run: brew audit --strict --formula rgielen/taps/leitum

      - name: Install from source
        run: brew install --build-from-source --formula rgielen/taps/leitum

      # `brew test` takes no --formula flag, unlike audit and install.
      - name: Test
        run: brew test rgielen/taps/leitum

      - name: Smoke check the installed binary
        run: |
          leitum --version
          leitum --help > /dev/null

  automerge:
    name: Merge the release bump
    needs: formula
    # Only the bump branches that rgielen/leitum's release workflow opens.
    # Anything else stays a human decision.
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'leitum-') &&
      github.event.pull_request.user.login == 'rgielen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --rebase --repo "$REPO"
